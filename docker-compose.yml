version: "3.9"

# ============================================================
# QB Risk Infra — Development / Integration Stack
# ============================================================
# Brings up: PostgreSQL, Redis, the API service, and the
# Streamlit dashboard as separate containers.
#
# Usage:
#   docker compose up -d
#   docker compose logs -f api
#   docker compose down -v  # tear down including volumes
# ============================================================

services:

  # ---- PostgreSQL ----------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: qb_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: qb_risk
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${QB__DATABASE__PASSWORD:-changeme}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init_db.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d qb_risk"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - qb_net

  # ---- Redis ---------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: qb_redis
    restart: unless-stopped
    command: >
      redis-server
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --save 60 1
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - qb_net

  # ---- API (FastAPI) -------------------------------------
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    container_name: qb_api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      QB__DATABASE__HOST: postgres
      QB__REDIS__HOST: redis
      QB__LOGGING__FORMAT: json
    volumes:
      - ./data:/app/data:ro
      - ./logs:/app/logs
      - ./config:/app/config:ro
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - qb_net
    deploy:
      resources:
        limits:
          memory: 512M

  # ---- Streamlit Dashboard -------------------------------
  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    container_name: qb_dashboard
    restart: unless-stopped
    env_file:
      - .env
    environment:
      QB__DATABASE__HOST: postgres
      QB__REDIS__HOST: redis
    volumes:
      - ./data:/app/data:ro
      - ./config:/app/config:ro
    ports:
      - "8501:8501"
    depends_on:
      - api
    command: >
      streamlit run src/dashboard/app.py
      --server.port 8501
      --server.address 0.0.0.0
      --server.headless true
      --browser.gatherUsageStats false
      --logger.level info
    networks:
      - qb_net
    deploy:
      resources:
        limits:
          memory: 512M

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  qb_net:
    driver: bridge
