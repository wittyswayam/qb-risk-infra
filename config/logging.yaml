version: 1
disable_existing_loggers: false

formatters:
  json:
    (): src.core.logging.JSONFormatter
  text:
    (): src.core.logging.TextFormatter

handlers:
  stdout:
    class: logging.StreamHandler
    stream: ext://sys.stdout
    formatter: json
  file:
    class: logging.FileHandler
    filename: logs/app.log
    mode: a
    formatter: json
    encoding: utf-8

root:
  level: INFO
  handlers:
    - stdout
    - file

loggers:
  src:
    level: DEBUG
    propagate: true
  uvicorn:
    level: INFO
    propagate: true
  sqlalchemy.engine:
    level: WARNING
    propagate: true
  urllib3:
    level: WARNING
    propagate: true
